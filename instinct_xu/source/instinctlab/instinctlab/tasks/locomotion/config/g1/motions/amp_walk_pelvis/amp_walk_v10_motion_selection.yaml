# ============================================================================
# V10b 的 AMP 参考数据集：**只留 2 个 clip**（用户 2026-09-29 指定的组合）
# ============================================================================
#   walk_forward_loop_002__A022   直行前进走（~0.6-1.0 m/s）⇒ 覆盖「一部分前进」
#   arc_walk_left_loop_001__A029  带弧线的行走（前进+转向）   ⇒ 覆盖「向前的斜向/转向」
#
# 为什么砍到 2 个（相对 `amp_walk_motion_selection.yaml` 的 **17 个**）：
#   ⚠️ 重要发现：仓库里那份 17-clip 选择文件一直是**实际生效**的那份，
#      （`amp_walk_env_cfg.py::MOTION_SELECTION_FILE` 指向它，且**没有任何版本覆盖过它**），
#      而 v9 MVP 的文档却写着「只留 1 个 clip」⇒ 文档与实际不符。
#      17 个 clip 里混着：后退×2、侧移×2、原地转身×2、慢跑×3、弧线×2、步态切换×1……
#      ⇒ 判别器的「专家分布」被摊成 17 种形态，**"走"这一模态的密度很稀**
#      ⇒ 风格奖励对"像不像走"几乎没有分辨力（与实测 gap 长期稳定在 1.1 附近、
#        但 d_actor 卡死在 −0.56 不动的现象一致）。
#   ⇒ 本版按用户指令收敛到 **2 个同族"走"clip**，让风格奖励重新专注在"走"上。
#
# ⚠️ 与指令集的对应关系（见 V10b 的指令分档）：
#   30% 低速(≤0.1, wz=0) + 35% 直行前向(0.4~0.7) + 35% 斜向/弧线(vx>0, vy≠0, wz∈±0.4)
#   ⇒ 低速段**没有参考动作**（这是设计上的：靠 `track_default_pose_on_stand` + 默认姿态
#      负责，且 `disable_style_on_stand` 会把这一段的风格奖励关掉）。
