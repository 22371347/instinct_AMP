# ============================================================================
# v9(MVP) 的 AMP 参考数据集：**只留 1 个纯前向「走」clip**
# ============================================================================
# 目的：MVP 只验证「原地 + 前向走」这一最小技能面。判据是「**风格集里只能有一种
#       步态**」——只要有第二种运动形态（快走/慢跑/侧移/后退/转向），判别器的风格
#       分布就会被摊平，最小验证里无法区分「策略没学会前向走」和「策略在前向走与
#       慢跑之间摇摆」。
#
# 相对 v3 的「精选 7 clip」**删掉的 6 个**（及其理由）：
#   ✗ walk_backward_loop_001__A022   后退：MVP 无后退指令；风格集里存在反向速度
#                                    会让判别器把前向步态也判「不像」
#   ✗ walk_sideway_left_loop_002__A021 / right_001__A022  侧移：MVP 无侧移指令
#   ✗ arc_walk_left_loop_001__A029 / walk_arc_cw_loop_002__A046  弧线：带转向，
#                                    而 MVP 的 wz ≡ 0（用户明确要求不带弧线）
#   ✗ jog_forward_loop_003__A022     慢跑（巡航 ~1.7-1.9 m/s）：⭐ 用户 2026-09-28
#                                    明确删除 —— **同为前向但步态不同**（跑步 vs 走），
#                                    两种前向形态同时存在会让风格奖励在「走」与
#                                    「跑」之间拉扯，污染最小验证的结论
#
# ✅ 只留 1 个：
#   walk_forward_loop_002__A022   前向走（~0.6-1.0 m/s）—— 覆盖 MVP 指令主体
#                                 （0 ~ 0.7 m/s）与「前向」这一唯一方向
#
# ⚠️ 指令范围 `(0.0, 0.7)` 与参考速度包络的关系：该 clip 速度 ≥ 0.6 m/s，
#    因此**低速段（≤0.1 m/s 的原地/微速）没有任何参考动作**——这正是为什么
#    `prob_low` 档必须保留（它覆盖「摇杆回中 = 立定」，靠
#    `track_default_pose_on_stand` 奖励 + 默认姿态负责，不靠参考动作）。
#
# ⚠️ 单 clip 的副作用（已知并接受）：判别器只见过一条轨迹 ⇒ 参考分布窄，
#    风格奖励更容易饱和；若 MVP 出现「风格奖励迅速塌到 0」，先看是不是这个原因，
#    再决定是否加回同族 clip（例如另一条 forward walk）。
