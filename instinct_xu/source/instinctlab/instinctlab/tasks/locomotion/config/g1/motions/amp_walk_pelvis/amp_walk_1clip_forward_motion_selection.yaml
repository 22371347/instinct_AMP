# ============================================================================
# 方案 A（用户 2026-10-01 指定的两种合法搭配之一）：**1 个前进步态 + 前进/停止指令**
# ============================================================================
#   walk_forward_loop_002__A022   直行前进走（巡航 ~0.6-1.0 m/s）
#
# ## 为什么要"只留 1 个"
#
# AMP_mjlab 的实战教训（用户 2026-10-01 明确要求照此执行）：
# **参考集里的模态越多，"走路"这一模态在专家分布里的密度就越稀** ⇒ 判别器给出的
# "像不像人"信号被摊薄 ⇒ 风格奖励对步态几乎失去分辨力（表现为 `amp_d` 长期卡在
# 某个负值不动、`amp_style_reward` 曲线走平）。
#
# 本仓库的实测佐证：17-clip 版（`amp_walk_motion_selection.yaml`，混着后退/侧移/
# 原地转身/慢跑/弧线/步态切换）训练时 `gap = d_ref − d_actor ≈ 1.1` 稳定不变、
# `d_actor` 卡死在 −0.56 ⇒ 判别器"说不出话"。
#
# ## 两种合法搭配（**以后只用这两种**）
#
# | 方案 | 参考数据集 | 指令集 | 用途 |
# |---|---|---|---|
# | **A（本文件）** | **1 clip**：纯直行前进 | **前进 + 停止**（`prob_low 0.40` / `prob_lin 0.60`，无侧向/无后退/无斜向） | 专注把"人形走路"这一件事学对 |
# | B | **5 clip**：直行 + 弧线 + 侧移×2 + 后退（`amp_walk_v13_motion_selection.yaml`） | 前后左右 + 停止 + 斜向（V13 的四档） | 全向行走（模态与指令**必须成套**换） |
#
# ⚠️ 指令与数据集**必须配套**：只加"后退指令"却不给后退参考 ⇒ 判别器会把该行为判为
# "不像参考"而抑制；反之只加"后退参考"却不给指令 ⇒ 白占专家分布密度。
#
# ⚠️ 与 V17 的关系：V17 实际用的是 **2 clip**（`amp_walk_v10_motion_selection.yaml`
# = 直行 + 弧线，经 V11←V10b 继承生效；**不是** 17-clip 那份）。本文件把它进一步
# 收敛成 1 个纯直行 clip。
